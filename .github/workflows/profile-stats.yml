name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  generate-profile-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      # ---------------------------------------------------------
      # GitHub Stats
      # ---------------------------------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &include_all_commits=true
            &title_color=A855F7
            &text_color=FFFFFF
            &icon_color=C084FC
            &bg_color=0D1117
            &border_color=7E22CE
            &border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Top Languages
      # ---------------------------------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=8
            &title_color=A855F7
            &text_color=FFFFFF
            &bg_color=0D1117
            &border_color=7E22CE
            &border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # Contribution Streak
      # ---------------------------------------------------------
      - name: Generate Contribution Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=${{ github.repository_owner }}
            &background=0D1117
            &border=7E22CE
            &stroke=7E22CE
            &ring=A855F7
            &fire=C084FC
            &currStreakNum=FFFFFF
            &sideNums=FFFFFF
            &currStreakLabel=A855F7
            &sideLabels=C084FC
            &dates=A1A1AA
            &border_radius=10
            &disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------
      # GitHub Trophies
      # ---------------------------------------------------------
      - name: Generate GitHub Trophies
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: aura

      # ---------------------------------------------------------
      # Commit Generated SVG Files
      # ---------------------------------------------------------
      - name: Commit Profile Stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update GitHub profile stats" || exit 0

          git push
